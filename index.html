<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 1 UTP - Estructura Blog CSS Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blog-container">
        <header class="blog-header">
            Header (Todo el ancho)
        </header>
        <main class="blog-main">
            Main Content (Zona principal izquierda)
            <p>Aquí irían los artículos del blog...</p>
        </main>
        <aside class="blog-sidebar">
            Sidebar (250px fijo derecha)
            <p>Publicidad o enlaces...</p>
        </aside>
        <footer class="blog-footer">
            Footer (Todo el ancho)
        </footer>
    </div>
</body>
</html>
